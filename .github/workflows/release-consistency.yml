name: Release consistency

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Compile validator
        run: python3 -m py_compile tools/validate_release_manifest.py

      - name: Validate maintained release state
        run: python3 tools/validate_release_manifest.py
