name: Fix issue 116 CI source root

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == '1-vps/hostpanel' && github.event.pull_request.head.ref == 'agent/issue116-bootstrap-trust'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: agent/issue116-bootstrap-trust
          fetch-depth: 0

      - name: Promote CI inputs to trusted source roots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one reviewed shape, found {text.count(old)}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          matrix = Path('test-matrix.sh')
          replace_once(
              matrix,
              '''  if ! python3 "$SCRIPT_DIR/tools/harden_install.py" \\
              "$SCRIPT_DIR/install.base.sh" "$generated"; then
          ''',
              '''  if ! HP_HARDENER_SOURCE_ROOT="$SCRIPT_DIR" \\
              python3 "$SCRIPT_DIR/tools/harden_install.py" \\
              "$SCRIPT_DIR/install.base.sh" "$generated"; then
          ''',
          )
          replace_once(
              matrix,
              '''  docker cp "$SCRIPT_DIR/tools/harden_install_runtime.py" "$cid:/root/hostpanel/tools/harden_install_runtime.py" >/dev/null
          }
          ''',
              '''  docker cp "$SCRIPT_DIR/tools/harden_install_runtime.py" "$cid:/root/hostpanel/tools/harden_install_runtime.py" >/dev/null
            docker exec "$cid" chown -R 0:0 /root/hostpanel
            docker exec "$cid" find /root/hostpanel -xdev -type d -exec chmod go-w {} +
            docker exec "$cid" find /root/hostpanel -xdev -type f -exec chmod go-w {} +
          }
          ''',
          )
          replace_once(
              matrix,
              '''    python3 tools/harden_install.py install.base.sh /tmp/install.generated.sh
          ''',
              '''    HP_HARDENER_SOURCE_ROOT=/root/hostpanel \\
                python3 tools/harden_install.py install.base.sh /tmp/install.generated.sh
          ''',
          )

          workflow = Path('.github/workflows/installer-hardening.yml')
          replace_once(
              workflow,
              '''              apt-get install -y -qq --no-install-recommends \\
                bash git ca-certificates openssl python3 python3-venv python3-pip tar gzip

              python3 tools/harden_install.py install.base.sh /tmp/install.generated.sh
          ''',
              '''              apt-get install -y -qq --no-install-recommends \\
                bash git ca-certificates openssl python3 python3-venv python3-pip tar gzip

              install -d -m 0700 /root/hostpanel-source
              cp -a /repo/. /root/hostpanel-source/
              chown -R 0:0 /root/hostpanel-source
              find /root/hostpanel-source -xdev -type d -exec chmod go-w {} +
              find /root/hostpanel-source -xdev -type f -exec chmod go-w {} +
              cd /root/hostpanel-source

              python3 tools/harden_install.py install.base.sh /tmp/install.generated.sh
          ''',
          )

          tests = Path('tests/test_issue116_bootstrap_security.py')
          replace_once(
              tests,
              '''HARDENER = (ROOT / "tools/harden_install.py").read_text(encoding="utf-8")
          ''',
              '''HARDENER = (ROOT / "tools/harden_install.py").read_text(encoding="utf-8")
          MATRIX = (ROOT / "test-matrix.sh").read_text(encoding="utf-8")
          INSTALLER_WORKFLOW = (ROOT / ".github/workflows/installer-hardening.yml").read_text(encoding="utf-8")
          ''',
          )
          replace_once(
              tests,
              '''    def test_noncanonical_repository_fails_before_fetch(self) -> None:
          ''',
              '''    def test_ci_promotes_inputs_to_owner_bound_source_roots(self) -> None:
              self.assertIn('HP_HARDENER_SOURCE_ROOT="$SCRIPT_DIR"', MATRIX)
              self.assertIn('chown -R 0:0 /root/hostpanel', MATRIX)
              self.assertIn('HP_HARDENER_SOURCE_ROOT=/root/hostpanel', MATRIX)
              self.assertIn('install -d -m 0700 /root/hostpanel-source', INSTALLER_WORKFLOW)
              self.assertIn('chown -R 0:0 /root/hostpanel-source', INSTALLER_WORKFLOW)
              self.assertIn('cd /root/hostpanel-source', INSTALLER_WORKFLOW)

              def test_noncanonical_repository_fails_before_fetch(self) -> None:
          ''',
          )
          PY
          bash -n test-matrix.sh
          python3 -m unittest -v tests.test_issue116_bootstrap_security
          ./test-matrix.sh --check-only
          rm -f .github/workflows/fix-issue116-ci-source-root.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-matrix.sh .github/workflows/installer-hardening.yml tests/test_issue116_bootstrap_security.py .github/workflows/fix-issue116-ci-source-root.yml
          git diff --cached --check
          git commit -m 'Bind CI hardener generation to trusted source roots'
          git push origin HEAD:agent/issue116-bootstrap-trust
