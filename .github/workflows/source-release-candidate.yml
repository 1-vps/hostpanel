name: Source release candidate

on:
  pull_request:
    paths:
      - '.github/workflows/source-release-candidate.yml'
      - '.github/workflows/publish-release.yml'
      - 'SOURCE_VERSION'
      - 'RELEASE_VERSION'
      - 'SHA256SUMS'
      - 'hostpanel-v*-source.tar.gz'
      - 'hostpanel-v*-source.tar.gz.sig'
      - 'app/**'
      - 'bootstrap-install.sh'
      - 'install.base.sh'
      - 'install.sh'
      - 'localization-overlay/**'
      - 'packaging/**'
      - 'releases/source-release-policy.json'
      - 'releases/update.pub'
      - 'tests/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-source-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REVIEWED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.REVIEWED_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact reviewed checkout
        run: |
          set -euo pipefail
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$REVIEWED_COMMIT" ]]
          git diff --exit-code -- .

      - name: Run source and release-bundle regressions
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/build-source-release.py \
            tools/run-source-release-builder.py \
            tools/compare-source-archives.py \
            tools/generate-source-attestations.py \
            tools/verify-source-release-bundle.py \
            tools/build-update-release.py \
            tools/verify-existing-release.py \
            tools/build-release-bundle.py
          python3 -m unittest discover -s tests -p 'test_source_release_builder.py' -v
          python3 -m unittest discover -s tests -p 'test_source_release_entrypoint.py' -v
          python3 -m unittest discover -s tests -p 'test_source_attestations.py' -v
          python3 -m unittest discover -s tests -p 'test_source_release_bundle_verifier.py' -v
          python3 -m unittest discover -s tests -p 'test_release_bundle_builder.py' -v
          python3 -m unittest discover -s tests -p 'test_release_bundle_candidate_workflow.py' -v
          python3 -m unittest discover -s tests -p 'test_single_update_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_github_update_pipeline.py' -v
          [[ "$(python3 tools/run-source-release-builder.py --repository-root . --print-version)" == "3.4.1" ]]
          [[ "$(python3 tools/build-update-release.py --repository-root . --print-version)" == "3.4.1" ]]

      - name: Build and verify the source candidate twice
        run: |
          set -euo pipefail
          mkdir -p dist-a dist-b
          python3 tools/run-source-release-builder.py \
            --repository-root . \
            --commit "$REVIEWED_COMMIT" \
            --output-dir dist-a
          python3 tools/run-source-release-builder.py \
            --repository-root . \
            --commit "$REVIEWED_COMMIT" \
            --output-dir dist-b
          archive_a="$(find dist-a -maxdepth 1 -type f -name 'hostpanel-v*-source.tar.gz' -print -quit)"
          archive_b="$(find dist-b -maxdepth 1 -type f -name 'hostpanel-v*-source.tar.gz' -print -quit)"
          [[ -n "$archive_a" && -n "$archive_b" ]]
          [[ "${archive_a##*/}" == "${archive_b##*/}" ]]
          python3 tools/compare-source-archives.py "$archive_a" "$archive_b"
          cmp -- "$archive_a" "$archive_b"
          for metadata in \
            source-build.json \
            sbom.cdx.json \
            dependency-lock-attestation.json \
            source-file-manifest.json; do
            cmp -- "dist-a/$metadata" "dist-b/$metadata"
          done
          for directory in dist-a dist-b; do
            archive="$(find "$directory" -maxdepth 1 -type f -name 'hostpanel-v*-source.tar.gz' -print -quit)"
            (
              cd "$directory"
              sha256sum \
                "${archive##*/}" \
                source-build.json \
                sbom.cdx.json \
                dependency-lock-attestation.json \
                source-file-manifest.json \
                > SOURCE-CANDIDATE-SHA256SUMS
              sha256sum -c SOURCE-CANDIDATE-SHA256SUMS
            )
            python3 tools/verify-source-release-bundle.py \
              --directory "$directory" \
              --repository-root . \
              --commit "$REVIEWED_COMMIT" \
              --source-version 3.4.1 \
              --release-id 3.4.1-hardened-r1
          done
          cmp -- dist-a/SOURCE-CANDIDATE-SHA256SUMS dist-b/SOURCE-CANDIDATE-SHA256SUMS
          python3 - "$REVIEWED_COMMIT" dist-a <<'PY'
          import json
          import pathlib
          import sys

          commit = sys.argv[1]
          directory = pathlib.Path(sys.argv[2])
          payload = json.loads((directory / "source-build.json").read_text(encoding="utf-8"))
          expected_keys = {
              "archive",
              "baseline",
              "built_at",
              "commit",
              "late_overlay_paths",
              "overlay_paths",
              "product",
              "release_id",
              "schema",
              "source_version",
          }
          if set(payload) != expected_keys:
              raise SystemExit("source-build.json has an unexpected shape")
          if payload["schema"] != 1 or payload["product"] != "hostpanel":
              raise SystemExit("source-build.json identity mismatch")
          if payload["commit"] != commit:
              raise SystemExit("source-build.json is not bound to the reviewed commit")
          if payload["source_version"] != "3.4.1":
              raise SystemExit("source-build.json has the wrong source version")
          if payload["release_id"] != "3.4.1-hardened-r1":
              raise SystemExit("source-build.json has the wrong release identifier")

          sbom = json.loads((directory / "sbom.cdx.json").read_text(encoding="utf-8"))
          if sbom.get("bomFormat") != "CycloneDX" or sbom.get("specVersion") != "1.6":
              raise SystemExit("SBOM identity mismatch")
          if not sbom.get("components"):
              raise SystemExit("SBOM contains no dependency components")

          lock = json.loads(
              (directory / "dependency-lock-attestation.json").read_text(encoding="utf-8")
          )
          if lock.get("source_version") != "3.4.1" or not lock.get("packages"):
              raise SystemExit("dependency lock attestation mismatch")
          if lock.get("lock", {}).get("package_count") != len(lock["packages"]):
              raise SystemExit("dependency lock package count mismatch")

          manifest = json.loads(
              (directory / "source-file-manifest.json").read_text(encoding="utf-8")
          )
          if manifest.get("source_version") != "3.4.1" or not manifest.get("entries"):
              raise SystemExit("source file manifest mismatch")
          if manifest.get("scope", {}).get("excludes") != ["source-file-manifest.json"]:
              raise SystemExit("source file manifest scope mismatch")
          PY

      - name: Build and verify the complete release bundle twice
        run: |
          set -euo pipefail
          python3 tools/build-release-bundle.py \
            --repository-root . \
            --commit "$REVIEWED_COMMIT" \
            --channel stable \
            --output-dir release-a \
            --summary release-a-summary.json
          python3 tools/build-release-bundle.py \
            --repository-root . \
            --commit "$REVIEWED_COMMIT" \
            --channel stable \
            --output-dir release-b \
            --summary release-b-summary.json
          cmp -- release-a-summary.json release-b-summary.json
          jq -e \
            --arg commit "$REVIEWED_COMMIT" \
            '.schema == 1 and .product == "hostpanel" and .channel == "stable" and
             .version == "3.4.1" and .release_id == "3.4.1-hardened-r1" and
             .tag == "v3.4.1" and .commit == $commit and (.payloads | length) == 9' \
            release-a-summary.json >/dev/null
          mapfile -t payloads < <(jq -r '.payloads | keys[]' release-a-summary.json)
          [[ "${#payloads[@]}" -eq 9 ]]
          for payload in "${payloads[@]}"; do
            expected_digest="$(jq -r --arg payload "$payload" '.payloads[$payload]' release-a-summary.json)"
            [[ "$(sha256sum "release-a/$payload" | awk '{print $1}')" == "$expected_digest" ]]
            [[ "$(sha256sum "release-b/$payload" | awk '{print $1}')" == "$expected_digest" ]]
            cmp -- "release-a/$payload" "release-b/$payload"
          done
          mapfile -t release_a_files < <(find release-a -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t release_b_files < <(find release-b -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ "${#release_a_files[@]}" -eq 9 ]]
          [[ "$(printf '%s\n' "${release_a_files[@]}")" == "$(printf '%s\n' "${release_b_files[@]}")" ]]

      - name: Upload unsigned source candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hostpanel-source-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist-a/hostpanel-v3.4.1-hardened-r1-source.tar.gz
            dist-a/source-build.json
            dist-a/sbom.cdx.json
            dist-a/dependency-lock-attestation.json
            dist-a/source-file-manifest.json
            dist-a/SOURCE-CANDIDATE-SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Upload unsigned complete release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hostpanel-release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-a/*
            release-a-summary.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false
