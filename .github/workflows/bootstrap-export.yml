name: Bootstrap export

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: hostpanel-bootstrap-source
          path: bootstrap-install.sh
          retention-days: 1
          compression-level: 0
