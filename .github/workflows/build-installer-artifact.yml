name: Build hardened installer artifact

on:
  pull_request:
    paths:
      - install.base.sh
      - install.sh
      - install-hardened.sh
      - tools/harden_install.py
      - tools/harden_install_runtime.py
      - tools/patch_reserved_sql_identifiers.py
      - tests/test_reserved_sql_identifiers.py
      - .github/workflows/build-installer-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Generate and postprocess installer
        run: |
          set -euo pipefail
          mkdir -p artifacts/hardened-installer
          python3 tools/harden_install.py install.base.sh /tmp/install.generated.sh
          python3 tools/patch_reserved_sql_identifiers.py \
            /tmp/install.generated.sh artifacts/hardened-installer/install.sh
          bash -n artifacts/hardened-installer/install.sh
          cp artifacts/hardened-installer/install.sh \
            artifacts/hardened-installer/install-hardened.sh
          sha256sum \
            artifacts/hardened-installer/install.sh \
            artifacts/hardened-installer/install-hardened.sh \
            >artifacts/hardened-installer/SHA256SUMS

      - name: Run reserved identifier regressions
        run: python3 -m unittest tests.test_reserved_sql_identifiers -v

      - name: Upload generated installers
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hardened-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/hardened-installer
          if-no-files-found: error
          retention-days: 14
