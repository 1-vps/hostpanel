name: Apply issue 115 updater integration

on:
  push:
    branches:
      - agent/updater-trust-monotonic
    paths:
      - .github/workflows/apply-issue115-integration.yml
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  integrate-and-validate:
    if: ${{ github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'run issue 115 integration') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: agent/updater-trust-monotonic
          fetch-depth: 0
          persist-credentials: false

      - name: Apply reviewed integration transform
        run: |
          set -euo pipefail
          python3 tools/apply-issue115-integration.py
          python3 tools/fix-issue115-tests.py
          git diff --check

      - name: Validate sources and release version
        run: |
          set -euo pipefail
          bash -n bootstrap-install.sh
          bash -n tools/install-update-agent.sh
          bash -n tools/run-qemu-vm-acceptance.sh
          bash -n tools/validate-production-vm.sh
          python3 -m py_compile \
            tools/hostpanel-update.py \
            tools/build-update-release.py \
            tools/harden_install.py \
            tools/apply-issue115-integration.py \
            tools/fix-issue115-tests.py \
            tests/test_qemu_default_version.py \
            tests/test_qemu_vm_acceptance.py \
            tests/test_updater_issue115.py
          test "$(python3 tools/build-update-release.py --print-version)" = 3.4.1

      - name: Run complete regression suite
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build verified final-tree artifact
        run: |
          set -euo pipefail
          rm -f tools/apply-issue115-integration.py \
            tools/fix-issue115-tests.py \
            .github/workflows/apply-issue115-integration.yml
          find . -type d -name __pycache__ -prune -exec rm -rf -- {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add -A
          git diff --cached --check
          mkdir -p artifacts/issue115-final
          git diff --cached --binary > artifacts/issue115-final/final.patch
          python3 - <<'PY'
          import json
          import pathlib
          import stat
          import subprocess
          import tarfile

          root = pathlib.Path.cwd()
          def names(diff_filter: str) -> list[str]:
              payload = subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only", f"--diff-filter={diff_filter}", "-z"]
              )
              return sorted(item.decode("utf-8") for item in payload.split(b"\0") if item)

          files = names("ACMRTUXB")
          deleted = names("D")
          entries = []
          archive_path = root / "artifacts" / "issue115-final" / "files.tar"
          with tarfile.open(archive_path, "w") as archive:
              for name in files:
                  path = root / name
                  metadata = path.lstat()
                  if not stat.S_ISREG(metadata.st_mode) or path.is_symlink():
                      raise SystemExit(f"unsafe final-tree file: {name}")
                  mode = "100755" if metadata.st_mode & stat.S_IXUSR else "100644"
                  entries.append({"path": name, "mode": mode})
                  archive.add(path, arcname=name, recursive=False)
          manifest = {
              "base_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "files": entries,
              "deleted": deleted,
          }
          (root / "artifacts" / "issue115-final" / "manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload verified final tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue115-final-tree-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/issue115-final
          if-no-files-found: error
          retention-days: 3
