name: Apply issue 115 updater integration

on:
  push:
    branches:
      - agent/updater-trust-monotonic
    paths:
      - .github/workflows/apply-issue115-integration.yml
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  integrate-and-validate:
    if: ${{ github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'run issue 115 integration') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: agent/updater-trust-monotonic
          fetch-depth: 0

      - name: Apply reviewed integration transform
        run: |
          set -euo pipefail
          python3 tools/apply-issue115-integration.py
          python3 tools/fix-issue115-tests.py
          git diff --check

      - name: Validate sources and release version
        run: |
          set -euo pipefail
          bash -n bootstrap-install.sh
          bash -n tools/install-update-agent.sh
          bash -n tools/run-qemu-vm-acceptance.sh
          bash -n tools/validate-production-vm.sh
          python3 -m py_compile \
            tools/hostpanel-update.py \
            tools/build-update-release.py \
            tools/harden_install.py \
            tools/apply-issue115-integration.py \
            tools/fix-issue115-tests.py \
            tests/test_qemu_default_version.py \
            tests/test_qemu_vm_acceptance.py \
            tests/test_updater_issue115.py
          test "$(python3 tools/build-update-release.py --print-version)" = 3.4.1

      - name: Run complete regression suite
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit verified non-workflow tree and stage workflow blobs
        run: |
          set -euo pipefail
          mkdir -p issue115-workflow-stage
          cp .github/workflows/publish-release.yml issue115-workflow-stage/publish-release.yml
          cp .github/workflows/qemu-vm-acceptance.yml issue115-workflow-stage/qemu-vm-acceptance.yml
          cp .github/workflows/vps-acceptance.yml issue115-workflow-stage/vps-acceptance.yml
          git checkout HEAD -- \
            .github/workflows/publish-release.yml \
            .github/workflows/qemu-vm-acceptance.yml \
            .github/workflows/vps-acceptance.yml \
            .github/workflows/apply-issue115-integration.yml
          rm -f tools/apply-issue115-integration.py tools/fix-issue115-tests.py
          find . -type d -name __pycache__ -prune -exec rm -rf -- {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add -A -- . ':!.github/workflows/**'
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Stage verified issue 115 final tree'
          git push origin HEAD:agent/updater-trust-monotonic
          printf 'PUSHED_COMMIT=%s\n' "$(git rev-parse HEAD)"
          printf 'PUSHED_TREE=%s\n' "$(git rev-parse HEAD^{tree})"
