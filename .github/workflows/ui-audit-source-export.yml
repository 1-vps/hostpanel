name: UI audit source export

on:
  pull_request:
    paths:
      - .github/workflows/ui-audit-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Package reviewed source
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/hostpanel-source.tar.gz" .
      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-audit-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hostpanel-source.tar.gz
          if-no-files-found: error
          retention-days: 1
