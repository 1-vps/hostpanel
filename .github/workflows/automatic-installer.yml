name: Automatic installer

on:
  pull_request:
    paths:
      - auto-install.sh
      - quick-install.sh
      - install-one-line.sh
      - SETUP.md
      - CUSTOMBUILD.md
      - CUSTOMBUILD-EXTRAS.md
      - examples/cloud-init-hostpanel.yaml
      - tools/harden_install.py
      - tools/hostpanel-build.py
      - tools/hostpanel_build_config.py
      - tools/hostpanel_build_packages.py
      - tools/hostpanel_build_operations.py
      - tools/hostpanel_build_cli.py
      - tools/hostpanel_build_ssl.py
      - tools/hostpanel_build_extras.py
      - tools/hostpanel_build_extras_state.py
      - tools/hostpanel_build_entry.py
      - tools/hostpanel_build_powerdns_adapter.py
      - tools/hostpanel_build_mongodb_adapter.py
      - tools/hostpanel_build_web.py
      - tools/install-hostpanel-build.sh
      - tools/patch_custombuild_runtime.py
      - tools/patch_powerdns_runtime.py
      - tools/patch_varnish_runtime.py
      - tools/patch_extras_doctor.py
      - tools/validate-production-vm.sh
      - tests/test_auto_install.py
      - tests/test_one_line_install.py
      - tests/test_hostpanel_build.py
      - tests/test_custombuild_openlitespeed.py
      - tests/test_custombuild_ssl.py
      - tests/test_custombuild_review_fixes.py
      - tests/test_custombuild_powerdns.py
      - tests/test_custombuild_extras.py
      - tests/test_custombuild_extras_state.py
      - tests/test_custombuild_platform_guards.py
      - tests/test_custombuild_powerdns_adapter.py
      - tests/test_custombuild_powerdns_runtime.py
      - tests/test_custombuild_deep_regressions.py
      - tests/test_openlitespeed_fallback.py
      - .github/workflows/automatic-installer.yml
  push:
    branches: [main]
    paths:
      - auto-install.sh
      - quick-install.sh
      - install-one-line.sh
      - SETUP.md
      - CUSTOMBUILD.md
      - CUSTOMBUILD-EXTRAS.md
      - examples/cloud-init-hostpanel.yaml
      - tools/harden_install.py
      - tools/hostpanel-build.py
      - tools/hostpanel_build_config.py
      - tools/hostpanel_build_packages.py
      - tools/hostpanel_build_operations.py
      - tools/hostpanel_build_cli.py
      - tools/hostpanel_build_ssl.py
      - tools/hostpanel_build_extras.py
      - tools/hostpanel_build_extras_state.py
      - tools/hostpanel_build_entry.py
      - tools/hostpanel_build_powerdns_adapter.py
      - tools/hostpanel_build_mongodb_adapter.py
      - tools/hostpanel_build_web.py
      - tools/install-hostpanel-build.sh
      - tools/patch_custombuild_runtime.py
      - tools/patch_powerdns_runtime.py
      - tools/patch_varnish_runtime.py
      - tools/patch_extras_doctor.py
      - tools/validate-production-vm.sh
      - tests/test_auto_install.py
      - tests/test_one_line_install.py
      - tests/test_hostpanel_build.py
      - tests/test_custombuild_openlitespeed.py
      - tests/test_custombuild_ssl.py
      - tests/test_custombuild_review_fixes.py
      - tests/test_custombuild_powerdns.py
      - tests/test_custombuild_extras.py
      - tests/test_custombuild_extras_state.py
      - tests/test_custombuild_platform_guards.py
      - tests/test_custombuild_powerdns_adapter.py
      - tests/test_custombuild_powerdns_runtime.py
      - tests/test_custombuild_deep_regressions.py
      - tests/test_openlitespeed_fallback.py
      - .github/workflows/automatic-installer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Parse installer and CustomBuild chain
        run: |
          bash -n auto-install.sh
          bash -n quick-install.sh
          bash -n install-one-line.sh
          bash -n tools/install-hostpanel-build.sh
          bash -n tools/validate-production-vm.sh
          python3 -m py_compile \
            tools/hostpanel-build.py \
            tools/hostpanel_build_config.py \
            tools/hostpanel_build_packages.py \
            tools/hostpanel_build_operations.py \
            tools/hostpanel_build_cli.py \
            tools/hostpanel_build_ssl.py \
            tools/hostpanel_build_extras.py \
            tools/hostpanel_build_extras_state.py \
            tools/hostpanel_build_entry.py \
            tools/hostpanel_build_powerdns_adapter.py \
            tools/hostpanel_build_mongodb_adapter.py \
            tools/hostpanel_build_web.py \
            tools/patch_custombuild_runtime.py \
            tools/patch_powerdns_runtime.py \
            tools/patch_varnish_runtime.py \
            tools/patch_extras_doctor.py
          python3 -m compileall -q tools tests
      - name: Run every CustomBuild regression
        run: python3 -m unittest discover -v -s tests -p 'test_custombuild*.py'
      - name: Run installer and fallback regressions
        run: |
          python3 -m unittest -v \
            tests.test_auto_install \
            tests.test_one_line_install \
            tests.test_hostpanel_build \
            tests.test_openlitespeed_fallback
      - name: ShellCheck installer chain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S error \
            auto-install.sh quick-install.sh install-one-line.sh \
            tools/install-hostpanel-build.sh tools/validate-production-vm.sh
