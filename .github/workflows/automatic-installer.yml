name: Automatic installer

on:
  pull_request:
    paths:
      - auto-install.sh
      - quick-install.sh
      - install-one-line.sh
      - SETUP.md
      - CUSTOMBUILD.md
      - tools/hostpanel-build.py
      - tools/hostpanel_build_*.py
      - tools/patch_custombuild_runtime.py
      - tools/install-hostpanel-build.sh
      - tools/harden_install.py
      - examples/cloud-init-hostpanel.yaml
      - tests/test_auto_install.py
      - tests/test_one_line_install.py
      - tests/test_hostpanel_build.py
      - tests/test_openlitespeed_fallback.py
      - .github/workflows/automatic-installer.yml
  push:
    branches: [main]
    paths:
      - auto-install.sh
      - quick-install.sh
      - install-one-line.sh
      - SETUP.md
      - CUSTOMBUILD.md
      - tools/hostpanel-build.py
      - tools/hostpanel_build_*.py
      - tools/patch_custombuild_runtime.py
      - tools/install-hostpanel-build.sh
      - tools/harden_install.py
      - examples/cloud-init-hostpanel.yaml
      - tests/test_auto_install.py
      - tests/test_one_line_install.py
      - tests/test_hostpanel_build.py
      - tests/test_openlitespeed_fallback.py
      - .github/workflows/automatic-installer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Parse installer chain
        run: |
          bash -n auto-install.sh
          bash -n quick-install.sh
          bash -n install-one-line.sh
          bash -n tools/install-hostpanel-build.sh
          python3 -m py_compile \
            tools/hostpanel-build.py \
            tools/hostpanel_build_config.py \
            tools/hostpanel_build_packages.py \
            tools/hostpanel_build_operations.py \
            tools/hostpanel_build_cli.py \
            tools/hostpanel_build_web.py \
            tools/patch_custombuild_runtime.py
      - name: Run automatic installer regressions
        run: >-
          python3 -m unittest -v
          tests.test_auto_install
          tests.test_one_line_install
          tests.test_hostpanel_build
          tests.test_openlitespeed_fallback
      - name: ShellCheck installer chain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S error auto-install.sh quick-install.sh install-one-line.sh tools/install-hostpanel-build.sh
