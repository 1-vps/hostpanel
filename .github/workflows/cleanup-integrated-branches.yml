name: Archive and clean working branches

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-integrated-branches
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.repository == '1-vps/hostpanel' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' &&
        github.event.issue.title == 'Run recoverable branch cleanup 838d9298-20260802'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Build recoverable branch archive
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="$RUNNER_TEMP/hostpanel-branch-cleanup"
          mkdir -p "$archive_dir"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git for-each-ref \
            --format='%(refname) %(objectname)' \
            refs/remotes/origin refs/tags \
            | sort > "$archive_dir/refs.txt"
          git bundle create "$archive_dir/hostpanel-pre-cleanup.bundle" --all
          git bundle verify "$archive_dir/hostpanel-pre-cleanup.bundle"
          sha256sum "$archive_dir/hostpanel-pre-cleanup.bundle" \
            > "$archive_dir/SHA256SUMS"

      - name: Upload private recovery bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hostpanel-pre-branch-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/hostpanel-branch-cleanup
          if-no-files-found: error
          retention-days: 90

      - name: Delete stale working branches without open pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(git rev-parse HEAD)"

          mapfile -t open_heads < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
              --jq '.[].head.ref' \
              | sort -u
          )
          mapfile -t candidates < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -E '^(agent|backup|validation)/' \
              | sort -u
          )

          deletable=()
          preserved=()
          for branch in "${candidates[@]}"; do
            keep=no
            for open_head in "${open_heads[@]}"; do
              if [[ "$branch" == "$open_head" ]]; then
                keep=yes
                break
              fi
            done
            if [[ "$keep" == yes ]]; then
              preserved+=("$branch")
            else
              deletable+=("$branch")
            fi
          done

          {
            echo '## Working branch cleanup'
            echo
            echo "Main: \`$main_sha\`"
            echo "Archived refs: $(wc -l < "$RUNNER_TEMP/hostpanel-branch-cleanup/refs.txt")"
            echo "Delete candidates: ${#deletable[@]}"
            echo "Preserved open-PR branches: ${#preserved[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

          for ((offset=0; offset<${#deletable[@]}; offset+=25)); do
            git push origin --delete "${deletable[@]:offset:25}"
          done

          if ((${#preserved[@]})); then
            {
              echo
              echo '### Preserved because an open pull request references them'
              printf -- '- `%s`\n' "${preserved[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
