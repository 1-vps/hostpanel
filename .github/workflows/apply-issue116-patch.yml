name: Apply issue 116 patch

on:
  push:
    branches:
      - agent/issue116-bootstrap-trust
    paths:
      - .github/workflows/apply-issue116-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: agent/issue116-bootstrap-trust
          fetch-depth: 0

      - name: Apply verified patch and validate
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue116-patch/*.b64 | base64 -d > /tmp/issue116.patch
          echo '7e989bf5b3f47709d1dbc58739621c19acea270f8d331adef2f58e92dcdbb6a1  /tmp/issue116.patch' | sha256sum -c -
          git apply --check /tmp/issue116.patch
          git apply /tmp/issue116.patch
          bash -n bootstrap-install.sh
          bash -n install.sh
          python3 -m py_compile tools/harden_install.py tests/test_issue116_bootstrap_security.py
          python3 -m unittest -v \
            tests.test_issue116_bootstrap_security \
            tests.test_private_repo_documentation
          git rm -r .github/issue116-patch .github/workflows/apply-issue116-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden bootstrap credentials and trusted source resolution (#116)'
          git push origin HEAD:agent/issue116-bootstrap-trust
