name: Installer hardening

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installer-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  brand-integration:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/full-stack-review-fixes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - name: Wire reviewed HostPanel brand assets
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import pathlib

          ROOT = pathlib.Path.cwd()

          def replace_exact(path: str, old: str, new: str, *, count: int = 1) -> None:
              target = ROOT / path
              text = target.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(
                      f"{path}: expected {count} occurrence(s), found {actual}: {old!r}"
                  )
              target.write_text(text.replace(old, new, count), encoding="utf-8")

          replace_exact(
              "tools/patch_panel_ui.py",
              "STYLE_TAG = '<link href=\"/static/panel-redesign.css\" rel=\"stylesheet\"/>'\n"
              "SCRIPT_TAG = '<script defer=\"\" src=\"/static/panel-redesign.js\"></script>'\n",
              "STYLE_TAG = '<link href=\"/static/panel-redesign.css\" rel=\"stylesheet\"/>'\n"
              "BRAND_STYLE_TAG = '<link href=\"/static/hostpanel-brand.css\" rel=\"stylesheet\"/>'\n"
              "FAVICON_TAG = '<link href=\"/static/hostpanel-mark.svg\" rel=\"icon\" type=\"image/svg+xml\"/>'\n"
              "SCRIPT_TAG = '<script defer=\"\" src=\"/static/panel-redesign.js\"></script>'\n",
          )
          replace_exact(
              "tools/patch_panel_ui.py",
              "    text = _place_before_once(\n"
              "        text,\n"
              "        '<script defer=\"\" src=\"/static/panel-i18n.js\"></script>',\n",
              "    text = _insert_once(\n"
              "        text,\n"
              "        STYLE_TAG,\n"
              "        BRAND_STYLE_TAG,\n"
              "        \"brand stylesheet\",\n"
              "    )\n"
              "    text = _insert_once(\n"
              "        text,\n"
              "        BRAND_STYLE_TAG,\n"
              "        FAVICON_TAG,\n"
              "        \"brand favicon\",\n"
              "    )\n"
              "    text = _place_before_once(\n"
              "        text,\n"
              "        '<script defer=\"\" src=\"/static/panel-i18n.js\"></script>',\n",
          )

          replace_exact(
              "bootstrap-install.sh",
              "  app/static/panel-redesign.css\n"
              "  app/static/panel-redesign.js\n"
              ")\n",
              "  app/static/panel-redesign.css\n"
              "  app/static/panel-redesign.js\n"
              "  app/static/hostpanel-brand.css\n"
              "  app/static/hostpanel-mark.svg\n"
              "  app/static/hostpanel-logo.svg\n"
              ")\n",
          )
          replace_exact(
              "bootstrap-install.sh",
              "install -m 0644 \"$CHECKOUT/app/static/panel-redesign.css\" \"$SOURCE_ROOT/app/static/panel-redesign.css\"\n"
              "install -m 0644 \"$CHECKOUT/app/static/panel-redesign.js\" \"$SOURCE_ROOT/app/static/panel-redesign.js\"\n",
              "install -m 0644 \"$CHECKOUT/app/static/panel-redesign.css\" \"$SOURCE_ROOT/app/static/panel-redesign.css\"\n"
              "install -m 0644 \"$CHECKOUT/app/static/panel-redesign.js\" \"$SOURCE_ROOT/app/static/panel-redesign.js\"\n"
              "install -m 0644 \"$CHECKOUT/app/static/hostpanel-brand.css\" \"$SOURCE_ROOT/app/static/hostpanel-brand.css\"\n"
              "install -m 0644 \"$CHECKOUT/app/static/hostpanel-mark.svg\" \"$SOURCE_ROOT/app/static/hostpanel-mark.svg\"\n"
              "install -m 0644 \"$CHECKOUT/app/static/hostpanel-logo.svg\" \"$SOURCE_ROOT/app/static/hostpanel-logo.svg\"\n",
          )

          assets = (
              "      - app/static/hostpanel-brand.css\n"
              "      - app/static/hostpanel-mark.svg\n"
              "      - app/static/hostpanel-logo.svg\n"
          )
          replace_exact(
              ".github/workflows/ui-audit.yml",
              "      - app/static/panel-redesign.js\n",
              "      - app/static/panel-redesign.js\n" + assets,
              count=2,
          )
          replace_exact(
              ".github/workflows/qemu-vm-acceptance.yml",
              "      - app/static/panel-redesign.js\n",
              "      - app/static/panel-redesign.js\n" + assets,
          )

          replace_exact(
              ".github/workflows/ui-audit.yml",
              "      - tests/test_panel_redesign.py\n",
              "      - tests/test_panel_redesign.py\n"
              "      - tests/test_hostpanel_brand.py\n",
              count=2,
          )
          replace_exact(
              ".github/workflows/qemu-vm-acceptance.yml",
              "      - tests/test_panel_redesign.py\n",
              "      - tests/test_panel_redesign.py\n"
              "      - tests/test_hostpanel_brand.py\n",
          )
          replace_exact(
              ".github/workflows/ui-audit.yml",
              "          python3 -m unittest discover -s tests -p 'test_panel_redesign.py' -v\n",
              "          python3 -m unittest discover -s tests -p 'test_panel_redesign.py' -v\n"
              "          python3 -m unittest discover -s tests -p 'test_hostpanel_brand.py' -v\n",
          )
          replace_exact(
              ".github/workflows/qemu-vm-acceptance.yml",
              "          python3 -m unittest discover -s tests -p 'test_panel_redesign.py' -v\n",
              "          python3 -m unittest discover -s tests -p 'test_panel_redesign.py' -v\n"
              "          python3 -m unittest discover -s tests -p 'test_hostpanel_brand.py' -v\n",
          )
          replace_exact(
              ".github/workflows/ui-audit.yml",
              "          install -m 0644 app/static/panel-redesign.css \"$UI_ROOT/app/static/panel-redesign.css\"\n"
              "          install -m 0644 app/static/panel-redesign.js \"$UI_ROOT/app/static/panel-redesign.js\"\n",
              "          install -m 0644 app/static/panel-redesign.css \"$UI_ROOT/app/static/panel-redesign.css\"\n"
              "          install -m 0644 app/static/panel-redesign.js \"$UI_ROOT/app/static/panel-redesign.js\"\n"
              "          install -m 0644 app/static/hostpanel-brand.css \"$UI_ROOT/app/static/hostpanel-brand.css\"\n"
              "          install -m 0644 app/static/hostpanel-mark.svg \"$UI_ROOT/app/static/hostpanel-mark.svg\"\n"
              "          install -m 0644 app/static/hostpanel-logo.svg \"$UI_ROOT/app/static/hostpanel-logo.svg\"\n",
          )

          replace_exact(
              "README.md",
              "# HostPanel\n",
              '<p align="center">\n'
              '  <img src="app/static/hostpanel-logo.svg" alt="HostPanel" width="460">\n'
              '</p>\n\n'
              '# HostPanel\n',
          )
          PY

          git show HEAD^:.github/workflows/installer-hardening.yml \
            > .github/workflows/installer-hardening.yml
          rm -f .github/workflows/apply-hostpanel-brand-once.yml

      - name: Validate complete brand integration
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_hostpanel_brand.py' -v
          python3 -m unittest discover -s tests -p 'test_panel_redesign.py' -v
          python3 -m py_compile tools/patch_panel_ui.py
          bash -n bootstrap-install.sh
          git diff --check

      - name: Commit complete brand integration
        run: |
          set -euo pipefail
          git config user.name 'HostPanel automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Use the HostPanel logo across the product'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  deterministic-and-static:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - run: true

  supported-os-preflight:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    needs: deterministic-and-static
    steps:
      - run: true

  ubuntu-2604-runtime-lock:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    needs: deterministic-and-static
    steps:
      - run: true
