name: Apply staged PHP support

on:
  pull_request:
    paths:
      - tools/.php-support-stage

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed PHP support patch
        run: |
          set -euo pipefail
          test -s tools/.php-support-stage || exit 0
          git apply --check tools/.php-support-stage
          git apply tools/.php-support-stage
          python3 -m py_compile tools/harden_install_runtime.py
          python3 tools/harden_install.py install.base.sh /tmp/install.generated.sh
          bash -n /tmp/install.generated.sh
          python3 -m unittest tests.test_installer_hardening -v
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/harden_install_runtime.py tests/test_installer_hardening.py
          git commit -m "Expand PHP runtime support and audits"
          git push origin "HEAD:${{ github.head_ref }}"
