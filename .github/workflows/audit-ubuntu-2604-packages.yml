name: Diagnose Ubuntu 26.04 packages

on:
  push:
    branches:
      - agent/ubuntu-26.04-support

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ubuntu-26.04-support
          fetch-depth: 0

      - name: Inspect package candidates
        shell: bash
        run: |
          set -u
          docker run --rm ubuntu:26.04 bash -ceu '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            required=(
              openssl rsync acl gnupg sqlite3 inotify-tools iproute2 git ca-certificates
              python3 python3-venv python3-pip curl ufw fail2ban unzip sudo nginx
              postgresql postgresql-contrib nodejs npm podman restic bind9-dnsutils
              apache2 apache2-utils libapache2-mod-fcgid composer certbot
              python3-certbot-nginx libfcgi-bin libnginx-mod-http-modsecurity
              modsecurity-crs radicale quota quotatool xfsprogs mariadb-server
              redis-server bind9 bind9-utils dovecot-core dovecot-imapd
              dovecot-lmtpd dovecot-sieve dovecot-managesieved opendkim
              opendkim-tools rspamd clamav clamav-daemon postfix postfix-pcre
              postsrsd exim4-base exim4-config exim4-daemon-heavy rclone
              php8.5-fpm php8.5-cli
            )
            printf "# Ubuntu 26.04 package candidate audit\n\n"
            printf "Generated: %s\n\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf "| Package | Candidate | Status |\n| --- | --- | --- |\n"
            missing=()
            for package in "${required[@]}"; do
              candidate=$(apt-cache policy "$package" | awk "/Candidate:/ {print \$2; exit}")
              if [[ -n "$candidate" && "$candidate" != "(none)" ]]; then
                printf "| %s | %s | available |\n" "$package" "$candidate"
              else
                printf "| %s | none | missing |\n" "$package"
                missing+=("$package")
              fi
            done
            printf "\n## Missing\n\n"
            if ((${#missing[@]})); then
              printf "%s\n" "${missing[@]}"
            else
              printf "None\n"
            fi
          ' > AUDIT-UBUNTU-26.04-PACKAGES.md

      - name: Commit diagnosis
        shell: bash
        run: |
          rm -f .github/workflows/audit-ubuntu-2604-packages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AUDIT-UBUNTU-26.04-PACKAGES.md .github/workflows/audit-ubuntu-2604-packages.yml
          git commit -m "Record Ubuntu 26.04 package audit"
          git push origin HEAD:agent/ubuntu-26.04-support
