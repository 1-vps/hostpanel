name: Apply deep audit hardening

on:
  push:
    branches: [agent/deep-audit-hardening]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply deep audit hardening') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-audit-hardening
          fetch-depth: 0
      - name: Apply audited patch
        run: python3 tools/apply_deep_audit_hardening.py
      - name: Validate generated files
        run: |
          bash -n install.sh
          bash -n bootstrap-install.sh
          python3 -m unittest tests.test_ubuntu_2604_support tests.test_installer_hardening -v
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add install.sh bootstrap-install.sh README.md SETUP.md test-matrix.sh run-full-test-matrix.sh tests/test_installer_hardening.py .github/workflows/installer-hardening.yml
          git commit -m 'Apply deep audit hardening'
          git push origin HEAD:agent/deep-audit-hardening
