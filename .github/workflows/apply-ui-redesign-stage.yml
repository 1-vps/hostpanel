name: Apply staged UI redesign

on:
  pull_request:
    paths:
      - tools/.ui-redesign-stage.b64
      - tools/.ui-redesign-stage.tail
      - .github/workflows/apply-ui-redesign-stage.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and apply reviewed UI bundle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, string
          data = pathlib.Path('tools/.ui-redesign-stage.b64').read_bytes()
          allowed = set((string.ascii_letters + string.digits + '+/=\r\n').encode())
          invalid = [(index, value) for index, value in enumerate(data) if value not in allowed]
          print(f'stage_length={len(data)} modulo={len(data) % 4} invalid={invalid[:8]}')
          print(f'stage_tail={data[-96:]!r}')
          PY
          cat tools/.ui-redesign-stage.b64 tools/.ui-redesign-stage.tail 2>/dev/null | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/ui-stage.tar.gz"
          echo '350ba7d96c38563c28ec425bf6f90a65a6461c64a346188f985124083fdbe52b  '"$RUNNER_TEMP/ui-stage.tar.gz" | sha256sum -c -
          python3 - "$RUNNER_TEMP/ui-stage.tar.gz" <<'PY'
          import pathlib, sys, tarfile
          archive = pathlib.Path(sys.argv[1])
          allowed = {
              'app/static/panel-redesign.css',
              'app/static/panel-redesign.js',
              'tools/patch_panel_ui.py',
              'tests/test_panel_redesign.py',
              'tests/test_php_runtime_support.py',
              'tests/php-runtime-compat.php',
              'tests/browser/panel-redesign.spec.js',
              '.github/workflows/ui-audit.yml',
              'bootstrap-install.sh',
              '.github/workflows/qemu-vm-acceptance.yml',
              'tests/test_qemu_vm_acceptance.py',
          }
          with tarfile.open(archive, 'r:gz') as handle:
              names = {member.name for member in handle.getmembers()}
              if names != allowed:
                  raise SystemExit(f'unexpected UI bundle members: {sorted(names ^ allowed)}')
              for member in handle.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or not member.isfile():
                      raise SystemExit(f'unsafe UI bundle member: {member.name}')
              handle.extractall('.')
          PY
          chmod 755 tools/patch_panel_ui.py
          chmod 644 app/static/panel-redesign.css app/static/panel-redesign.js
          python3 -m py_compile tools/patch_panel_ui.py tests/test_panel_redesign.py tests/test_php_runtime_support.py
          node --check app/static/panel-redesign.js
          node --check tests/browser/panel-redesign.spec.js
          python3 -m unittest tests.test_panel_redesign tests.test_php_runtime_support tests.test_qemu_vm_acceptance -v
          bash -n bootstrap-install.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            app/static/panel-redesign.css \
            app/static/panel-redesign.js \
            tools/patch_panel_ui.py \
            tests/test_panel_redesign.py \
            tests/test_php_runtime_support.py \
            tests/php-runtime-compat.php \
            tests/browser/panel-redesign.spec.js \
            .github/workflows/ui-audit.yml \
            bootstrap-install.sh \
            .github/workflows/qemu-vm-acceptance.yml \
            tests/test_qemu_vm_acceptance.py
          git commit -m 'Redesign control panel and add viewport audits'
          git push origin "HEAD:${{ github.head_ref }}"
