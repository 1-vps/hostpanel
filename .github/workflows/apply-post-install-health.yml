name: Apply post-install health correction

on:
  push:
    branches:
      - agent/qemu-vm-acceptance
    paths:
      - .github/workflows/apply-post-install-health.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == '1-vps/hostpanel'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the patch branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/qemu-vm-acceptance
          fetch-depth: 0

      - name: Apply the reviewed correction
        run: python3 tools/apply_post_install_health_patch.py

      - name: Validate generated installer and regression
        run: |
          python3 -m py_compile tools/harden_install.py tests/test_post_install_health.py
          generated="$(mktemp)"
          trap 'rm -f "$generated"' EXIT
          python3 tools/harden_install.py install.base.sh "$generated"
          bash -n "$generated"
          python3 -m unittest tests.test_post_install_health

      - name: Commit the correction
        run: |
          git config user.name 'hostpanel-ci'
          git config user.email 'hostpanel-ci@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Create initial backup before post-install doctor'
          git push origin HEAD:agent/qemu-vm-acceptance
