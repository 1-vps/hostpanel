name: VPS acceptance

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type ERASE-AND-INSTALL to authorize a destructive disposable-VM installation
        required: true
        type: string
      reviewed_commit_sha:
        description: Exact reviewed 40-character commit SHA to install and validate
        required: true
        type: string
      provider_instance_id:
        description: Exact provider instance ID reviewed in the provider console
        required: true
        type: string
      snapshot_id:
        description: Exact fresh snapshot ID reviewed in the provider console
        required: true
        type: string
      snapshot_created_at_utc:
        description: Snapshot creation time in canonical UTC form YYYY-MM-DDTHH:MM:SSZ; maximum age 24 hours
        required: true
        type: string
      snapshot_confirmation:
        description: Type SNAPSHOT-VERIFIED:<instance>:<snapshot>:<commit>:<created-at-utc>
        required: true
        type: string
      reinstall:
        description: Permit reinstall when /opt/hostpanel already exists
        required: true
        default: false
        type: boolean
      panel_host:
        description: Panel FQDN; blank derives panel.<VPS IPv4>.nip.io
        required: false
        default: ''
        type: string
      mta:
        description: Mail transfer agent
        required: true
        default: postfix
        type: choice
        options:
          - postfix
          - exim

permissions:
  contents: read

concurrency:
  group: vps-acceptance-${{ github.repository }}
  cancel-in-progress: false

jobs:
  acceptance:
    if: ${{ inputs.confirm == 'ERASE-AND-INSTALL' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: vps-acceptance
    env:
      REVIEWED_COMMIT_SHA: ${{ inputs.reviewed_commit_sha }}
      PROVIDER_INSTANCE_ID: ${{ inputs.provider_instance_id }}
      SNAPSHOT_ID: ${{ inputs.snapshot_id }}
      SNAPSHOT_CREATED_AT_UTC: ${{ inputs.snapshot_created_at_utc }}
      SNAPSHOT_CONFIRMATION: ${{ inputs.snapshot_confirmation }}
      EXPECTED_VERSION: 3.4.0
      PANEL_HOST_INPUT: ${{ inputs.panel_host }}
      REINSTALL: ${{ inputs.reinstall }}
      MTA: ${{ inputs.mta }}
      EVIDENCE_ROOT: provider-artifacts/evidence
      SEALED_EVIDENCE: provider-artifacts/hostpanel-vps-acceptance.tar

    steps:
      - name: Check out the reviewed acceptance commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.reviewed_commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare fail-closed provider evidence
        if: always()
        run: |
          set -euo pipefail
          python3 tools/prepare-provider-evidence.py

      - name: Validate authorization, current main, inputs, and environment gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_IPV6: ${{ secrets.VPS_IPV6 }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_PROVIDER_INSTANCE_ID: ${{ secrets.VPS_PROVIDER_INSTANCE_ID }}
        run: |
          set -euo pipefail
          [[ "${{ github.ref }}" == refs/heads/main ]] || {
            echo 'VPS acceptance must be dispatched from main.' >&2
            exit 1
          }
          [[ "${{ inputs.confirm }}" == ERASE-AND-INSTALL ]]
          [[ "$REVIEWED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'reviewed_commit_sha must be a lowercase full 40-character commit SHA.' >&2
            exit 1
          }
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          [[ "$CHECKED_OUT_SHA" == "$REVIEWED_COMMIT_SHA" ]] || {
            echo 'Checkout does not match REVIEWED_COMMIT_SHA.' >&2
            exit 1
          }
          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$CURRENT_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'GitHub API returned an invalid current main SHA.' >&2
            exit 1
          }
          [[ "$CURRENT_MAIN_SHA" == "$REVIEWED_COMMIT_SHA" ]] || {
            echo "Refusing stale VPS acceptance: reviewed commit $REVIEWED_COMMIT_SHA is not current main $CURRENT_MAIN_SHA." >&2
            exit 1
          }
          [[ "$GITHUB_SHA" == "$CURRENT_MAIN_SHA" ]] || {
            echo "Refusing stale VPS acceptance: workflow dispatch SHA $GITHUB_SHA is not current main $CURRENT_MAIN_SHA." >&2
            exit 1
          }

          [[ "$PROVIDER_INSTANCE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]] || {
            echo 'provider_instance_id has an unsafe format.' >&2
            exit 1
          }
          [[ "$SNAPSHOT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]] || {
            echo 'snapshot_id has an unsafe format.' >&2
            exit 1
          }
          [[ -n "$VPS_PROVIDER_INSTANCE_ID" ]] || {
            echo 'Missing required environment secret: VPS_PROVIDER_INSTANCE_ID' >&2
            exit 1
          }
          [[ "$PROVIDER_INSTANCE_ID" == "$VPS_PROVIDER_INSTANCE_ID" ]] || {
            echo 'provider_instance_id does not match the protected environment instance identity.' >&2
            exit 1
          }
          python3 - "$SNAPSHOT_CREATED_AT_UTC" <<'PY'
          import datetime as dt
          import sys

          raw = sys.argv[1]
          try:
              created = dt.datetime.strptime(raw, "%Y-%m-%dT%H:%M:%SZ").replace(
                  tzinfo=dt.timezone.utc
              )
          except ValueError as exc:
              raise SystemExit("snapshot_created_at_utc must use canonical UTC format") from exc
          now = dt.datetime.now(dt.timezone.utc)
          age = now - created
          if age < -dt.timedelta(minutes=5):
              raise SystemExit("snapshot creation time is unacceptably in the future")
          if age > dt.timedelta(hours=24):
              raise SystemExit("snapshot is older than the 24-hour acceptance limit")
          PY
          EXPECTED_SNAPSHOT_CONFIRMATION="SNAPSHOT-VERIFIED:${PROVIDER_INSTANCE_ID}:${SNAPSHOT_ID}:${REVIEWED_COMMIT_SHA}:${SNAPSHOT_CREATED_AT_UTC}"
          [[ "$SNAPSHOT_CONFIRMATION" == "$EXPECTED_SNAPSHOT_CONFIRMATION" ]] || {
            echo 'snapshot_confirmation does not bind the reviewed instance, snapshot, commit, and creation time.' >&2
            exit 1
          }
          unset EXPECTED_SNAPSHOT_CONFIRMATION

          [[ -n "$VPS_HOST" ]] || { echo 'Missing required environment secret: VPS_HOST' >&2; exit 1; }
          VPS_PORT="${VPS_SSH_PORT:-22}"
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] && ((VPS_PORT >= 1 && VPS_PORT <= 65535))
          case "$MTA" in
            postfix|exim) ;;
            *) echo 'Unsupported MTA.' >&2; exit 1 ;;
          esac

          python3 - "$VPS_HOST" "$VPS_IPV6" "$PANEL_HOST_INPUT" <<'PY'
          import ipaddress
          import re
          import sys

          host, ipv6, panel = sys.argv[1:]
          address = ipaddress.ip_address(host)
          if ipv6:
              parsed_v6 = ipaddress.ip_address(ipv6)
              if parsed_v6.version != 6:
                  raise SystemExit("VPS_IPV6 must be an IPv6 literal")
          if panel:
              if len(panel) > 253 or not re.fullmatch(
                  r"(?=.{1,253}\Z)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?",
                  panel,
              ):
                  raise SystemExit("panel_host must be a valid FQDN")
          elif address.version != 4:
              raise SystemExit("panel_host is required when VPS_HOST is IPv6")
          PY

          PANEL_HOST="$PANEL_HOST_INPUT"
          if [[ -z "$PANEL_HOST" ]]; then
            PANEL_HOST="panel.${VPS_HOST}.nip.io"
          fi
          RUNNER_IPV4="$(curl -4fsS --retry 4 --connect-timeout 10 https://api.ipify.org)"
          python3 - "$RUNNER_IPV4" <<'PY'
          import ipaddress
          import sys
          if ipaddress.ip_address(sys.argv[1]).version != 4:
              raise SystemExit("GitHub runner did not return an IPv4 address")
          PY

          {
            printf 'VPS_HOST=%s\n' "$VPS_HOST"
            printf 'VPS_IPV6=%s\n' "$VPS_IPV6"
            printf 'VPS_PORT=%s\n' "$VPS_PORT"
            printf 'PANEL_HOST=%s\n' "$PANEL_HOST"
            printf 'ADMIN_CIDR=%s/32\n' "$RUNNER_IPV4"
            printf 'CURRENT_MAIN_SHA=%s\n' "$CURRENT_MAIN_SHA"
          } >> "$GITHUB_ENV"

      - name: Install SSH and probe dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            openssh-client sshpass curl dnsutils netcat-openbsd

      - name: Configure strict SSH host verification and acceptance context
        env:
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KNOWN_HOSTS" ]] || { echo 'Missing VPS_SSH_KNOWN_HOSTS.' >&2; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          [[ -s "$HOME/.ssh/known_hosts" ]]
          [[ -d "$EVIDENCE_ROOT" && ! -L "$EVIDENCE_ROOT" ]]
          rm -f "$EVIDENCE_ROOT/runner-evidence-state.txt"
          {
            printf 'reviewed_commit_sha=%s\n' "$REVIEWED_COMMIT_SHA"
            printf 'current_main_sha=%s\n' "$CURRENT_MAIN_SHA"
            printf 'workflow_dispatch_sha=%s\n' "$GITHUB_SHA"
            printf 'workflow_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'workflow_run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'provider_instance_id=%s\n' "$PROVIDER_INSTANCE_ID"
            printf 'snapshot_id=%s\n' "$SNAPSHOT_ID"
            printf 'snapshot_created_at_utc=%s\n' "$SNAPSHOT_CREATED_AT_UTC"
          } > "$EVIDENCE_ROOT/acceptance-context.txt"
          cat > "$EVIDENCE_ROOT/manual-release-checklist.txt" <<'CHECKLIST'
          authoritative_dns_delegation=NOT_AUTOMATED
          inbound_outbound_mail_and_authentication=NOT_AUTOMATED
          disposable_web_php_database_flow=NOT_AUTOMATED
          backup_restore_round_trip=NOT_AUTOMATED
          customer_filesystem_quota_enforcement=NOT_AUTOMATED
          provider_snapshot_rollback=NOT_AUTOMATED
          final_release_readiness=INCOMPLETE_UNTIL_MANUAL_EVIDENCE_ATTACHED
          CHECKLIST
          chmod 600 \
            "$EVIDENCE_ROOT/acceptance-context.txt" \
            "$EVIDENCE_ROOT/manual-release-checklist.txt"

      - name: Inventory the disposable VM
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SSHPASS" ]] || { echo 'Missing VPS_ROOT_PASSWORD.' >&2; exit 1; }
          SSH=(sshpass -e ssh -p "$VPS_PORT"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o PreferredAuthentications=password
            -o PubkeyAuthentication=no
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4)
          "${SSH[@]}" root@"$VPS_HOST" '
            set -euo pipefail
            printf "== operating system ==\n"
            cat /etc/os-release
            printf "== kernel ==\n"
            uname -a
            printf "== boot id ==\n"
            cat /proc/sys/kernel/random/boot_id
            printf "== pid 1 ==\n"
            cat /proc/1/comm
            printf "== disks ==\n"
            df -hT
            printf "== memory ==\n"
            free -h
            printf "== addresses ==\n"
            ip -brief address
            printf "== existing hostpanel ==\n"
            test ! -e /opt/hostpanel || find /opt/hostpanel -maxdepth 2 -mindepth 1 -printf "%p\n" | sed -n "1,100p"
          ' | tee "$EVIDENCE_ROOT/pre-install-inventory.txt"

      - name: Install HostPanel and prepare reboot validation
        env:
          GH_TOKEN: ${{ github.token }}
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
          HP_VPS_REPO_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -n "$SSHPASS" ]] || { echo 'Missing VPS_ROOT_PASSWORD.' >&2; exit 1; }
          local_cleanup(){
            rm -f /tmp/hostpanel-acceptance.env /tmp/hostpanel-acceptance-remote.sh
          }
          trap local_cleanup EXIT

          SSH=(sshpass -e ssh -p "$VPS_PORT"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o PreferredAuthentications=password
            -o PubkeyAuthentication=no
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4)
          SCP=(sshpass -e scp -P "$VPS_PORT"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o PreferredAuthentications=password
            -o PubkeyAuthentication=no
            -o ConnectTimeout=20)

          LATEST_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$LATEST_MAIN_SHA" == "$REVIEWED_COMMIT_SHA" ]] || {
            echo "Refusing stale VPS installation: reviewed commit $REVIEWED_COMMIT_SHA is no longer current main $LATEST_MAIN_SHA." >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$REVIEWED_COMMIT_SHA" ]]
          [[ -n "$HP_VPS_REPO_TOKEN" ]]
          [[ "$HP_VPS_REPO_TOKEN" != *$'\n'* && "$HP_VPS_REPO_TOKEN" != *$'\r'* ]]
          REPO_AUTH_HEADER="$(printf 'x-access-token:%s' "$HP_VPS_REPO_TOKEN" | base64 | tr -d '\r\n')"

          umask 077
          {
            printf 'HP_PANEL_HOST=%q\n' "$PANEL_HOST"
            printf 'HP_PANEL_ADMIN_CIDR=%q\n' "$ADMIN_CIDR"
            printf 'HP_EXPECTED_PUBLIC_IP=%q\n' "$VPS_HOST"
            printf 'HP_EXPECTED_VERSION=%q\n' "$EXPECTED_VERSION"
            printf 'HP_REVIEWED_COMMIT_SHA=%q\n' "$REVIEWED_COMMIT_SHA"
            printf 'HP_PROVIDER_INSTANCE_ID=%q\n' "$PROVIDER_INSTANCE_ID"
            printf 'HP_PROVIDER_SNAPSHOT_ID=%q\n' "$SNAPSHOT_ID"
            printf 'HP_PROVIDER_SNAPSHOT_CREATED_AT_UTC=%q\n' "$SNAPSHOT_CREATED_AT_UTC"
            printf 'HP_MTA=%q\n' "$MTA"
            printf 'HP_REINSTALL=%q\n' "$REINSTALL"
            printf 'export GIT_CONFIG_COUNT=1\n'
            printf 'export GIT_CONFIG_KEY_0=%q\n' 'http.https://github.com/.extraheader'
            printf 'export GIT_CONFIG_VALUE_0=%q\n' "AUTHORIZATION: basic $REPO_AUTH_HEADER"
            printf 'export GIT_TERMINAL_PROMPT=0\n'
          } > /tmp/hostpanel-acceptance.env
          unset HP_VPS_REPO_TOKEN REPO_AUTH_HEADER

          cat > /tmp/hostpanel-acceptance-remote.sh <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077
          source /root/hostpanel-acceptance.env

          EVIDENCE=/root/hostpanel-acceptance-evidence
          PRIVATE_LOG=/root/hostpanel-acceptance-private-install.log
          install -d -o root -g root -m 700 "$EVIDENCE"
          : > "$PRIVATE_LOG"
          chmod 600 "$PRIVATE_LOG"

          clear_repo_auth(){
            if [[ -f /root/hostpanel-acceptance.env && ! -L /root/hostpanel-acceptance.env ]]; then
              sed -i '/^export GIT_/d' /root/hostpanel-acceptance.env || true
              chmod 600 /root/hostpanel-acceptance.env || true
            fi
            unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GIT_TERMINAL_PROMPT
          }
          trap clear_repo_auth EXIT
          trap 'status=$?; echo "Acceptance setup failed at line $LINENO. Inspect the root-only private log on the VPS." >&2; exit "$status"' ERR

          [[ "$(cat /proc/1/comm 2>/dev/null || true)" == systemd ]] || {
            echo 'A real systemd VM is required.' >&2
            exit 1
          }
          if [[ -e /opt/hostpanel && "$HP_REINSTALL" != true ]]; then
            echo '/opt/hostpanel already exists; rerun with reinstall enabled only after reviewing the host.' >&2
            exit 1
          fi
          for input in \
            /root/bootstrap-install.sh \
            /root/validate-production-vm.sh \
            /root/secure-validation-io.py; do
            [[ -f "$input" && ! -L "$input" ]] || {
              echo "Unsafe or missing acceptance input: $input" >&2
              exit 1
            }
            [[ "$(stat -c '%u:%h' "$input")" == "0:1" ]] || {
              echo "Unsafe acceptance input ownership or link count: $input" >&2
              exit 1
            }
            chmod 700 "$input"
          done

          echo 'Installing bootstrap prerequisites; detailed output remains root-only on the VPS.'
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >> "$PRIVATE_LOG" 2>&1
            apt-get install -y -qq ca-certificates curl git openssl python3 >> "$PRIVATE_LOG" 2>&1
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y ca-certificates curl git openssl python3 >> "$PRIVATE_LOG" 2>&1
          else
            echo 'Unsupported package manager.' >&2
            exit 1
          fi

          bash -n /root/bootstrap-install.sh
          bash -n /root/validate-production-vm.sh
          python3 -m py_compile /root/secure-validation-io.py

          install_args=(--mta "$HP_MTA")
          if [[ "$HP_REINSTALL" == true ]]; then
            install_args=(--reinstall "${install_args[@]}")
          fi
          common_env=(
            HP_REPO_REF="$HP_REVIEWED_COMMIT_SHA"
            HP_PANEL_HOST="$HP_PANEL_HOST"
            HP_PANEL_ADMIN_CIDR="$HP_PANEL_ADMIN_CIDR"
            HP_MULTI_PHP_REPO=off
            HP_RSPAMD_REPO=off
          )

          echo 'Running installer preflight; detailed output remains root-only on the VPS.'
          env "${common_env[@]}" bash /root/bootstrap-install.sh --check "${install_args[@]}" >> "$PRIVATE_LOG" 2>&1
          echo 'Running full installation; generated credentials remain root-only on the VPS.'
          env "${common_env[@]}" bash /root/bootstrap-install.sh "${install_args[@]}" >> "$PRIVATE_LOG" 2>&1
          clear_repo_auth
          trap - EXIT

          test "$(tr -d '[:space:]' < /opt/hostpanel/VERSION)" = "$HP_EXPECTED_VERSION"
          echo 'Running non-sensitive VM validation.'
          env \
            HP_EXPECTED_VERSION="$HP_EXPECTED_VERSION" \
            HP_PANEL_HOST="$HP_PANEL_HOST" \
            HP_EXPECTED_PUBLIC_IP="$HP_EXPECTED_PUBLIC_IP" \
            HP_PROVIDER_INSTANCE_ID="$HP_PROVIDER_INSTANCE_ID" \
            HP_PROVIDER_SNAPSHOT_ID="$HP_PROVIDER_SNAPSHOT_ID" \
            HP_PROVIDER_SNAPSHOT_CREATED_AT_UTC="$HP_PROVIDER_SNAPSHOT_CREATED_AT_UTC" \
            bash /root/validate-production-vm.sh --check | tee "$EVIDENCE/pre-reboot-validator.txt"
          env \
            HP_EXPECTED_VERSION="$HP_EXPECTED_VERSION" \
            HP_PANEL_HOST="$HP_PANEL_HOST" \
            HP_EXPECTED_PUBLIC_IP="$HP_EXPECTED_PUBLIC_IP" \
            HP_PROVIDER_INSTANCE_ID="$HP_PROVIDER_INSTANCE_ID" \
            HP_PROVIDER_SNAPSHOT_ID="$HP_PROVIDER_SNAPSHOT_ID" \
            HP_PROVIDER_SNAPSHOT_CREATED_AT_UTC="$HP_PROVIDER_SNAPSHOT_CREATED_AT_UTC" \
            bash /root/validate-production-vm.sh --prepare-reboot | tee "$EVIDENCE/prepare-reboot-validator.txt"

          cat /etc/os-release > "$EVIDENCE/os-release.txt"
          uname -a > "$EVIDENCE/uname.txt"
          cat /proc/sys/kernel/random/boot_id > "$EVIDENCE/pre-reboot-boot-id.txt"
          cat /opt/hostpanel/VERSION > "$EVIDENCE/version.txt"
          systemctl --failed --no-legend --plain > "$EVIDENCE/failed-units-pre-reboot.txt" || true
          echo 'Pre-reboot installation and validation completed.'
          REMOTE

          chmod 700 /tmp/hostpanel-acceptance-remote.sh
          "${SCP[@]}" \
            bootstrap-install.sh \
            tools/validate-production-vm.sh \
            tools/secure-validation-io.py \
            /tmp/hostpanel-acceptance.env \
            /tmp/hostpanel-acceptance-remote.sh \
            root@"$VPS_HOST":/root/
          rm -f /tmp/hostpanel-acceptance.env
          "${SSH[@]}" root@"$VPS_HOST" '
            chmod 600 /root/hostpanel-acceptance.env
            chmod 700 \
              /root/bootstrap-install.sh \
              /root/validate-production-vm.sh \
              /root/secure-validation-io.py \
              /root/hostpanel-acceptance-remote.sh
            /root/hostpanel-acceptance-remote.sh
          '

      - name: Reboot and wait for SSH
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SSHPASS" ]] || { echo 'Missing VPS_ROOT_PASSWORD.' >&2; exit 1; }
          SSH=(sshpass -e ssh -p "$VPS_PORT"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o PreferredAuthentications=password
            -o PubkeyAuthentication=no
            -o ConnectTimeout=15)
          "${SSH[@]}" root@"$VPS_HOST" 'systemctl reboot' || true

          port_open(){ nc -z -w 3 "$VPS_HOST" "$VPS_PORT" >/dev/null 2>&1; }
          went_down=false
          for _ in $(seq 1 60); do
            if ! port_open; then
              went_down=true
              break
            fi
            sleep 5
          done
          [[ "$went_down" == true ]] || {
            echo 'SSH did not close for reboot.' >&2
            exit 1
          }

          for _ in $(seq 1 180); do
            if port_open; then
              sleep 10
              exit 0
            fi
            sleep 5
          done
          echo 'SSH did not return after reboot.' >&2
          exit 1

      - name: Run post-reboot validation
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SSHPASS" ]] || { echo 'Missing VPS_ROOT_PASSWORD.' >&2; exit 1; }
          SSH=(sshpass -e ssh -p "$VPS_PORT"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o PreferredAuthentications=password
            -o PubkeyAuthentication=no
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4)
          "${SSH[@]}" root@"$VPS_HOST" '
            set -euo pipefail
            cleanup_acceptance_state(){
              local status=$? cleanup_status=0
              trap - EXIT
              if ! rm -f \
                /root/hostpanel-acceptance.env \
                /root/bootstrap-install.sh \
                /root/validate-production-vm.sh \
                /root/secure-validation-io.py \
                /root/hostpanel-acceptance-remote.sh; then
                cleanup_status=1
              fi
              if ((status == 0 && cleanup_status == 0)); then
                if ! rm -f /root/hostpanel-acceptance-private-install.log; then
                  cleanup_status=1
                fi
              fi
              if ((status != 0)); then
                exit "$status"
              fi
              exit "$cleanup_status"
            }
            trap cleanup_acceptance_state EXIT
            source /root/hostpanel-acceptance.env
            EVIDENCE=/root/hostpanel-acceptance-evidence
            env \
              HP_EXPECTED_VERSION="$HP_EXPECTED_VERSION" \
              HP_PANEL_HOST="$HP_PANEL_HOST" \
              HP_EXPECTED_PUBLIC_IP="$HP_EXPECTED_PUBLIC_IP" \
              HP_PROVIDER_INSTANCE_ID="$HP_PROVIDER_INSTANCE_ID" \
              HP_PROVIDER_SNAPSHOT_ID="$HP_PROVIDER_SNAPSHOT_ID" \
              HP_PROVIDER_SNAPSHOT_CREATED_AT_UTC="$HP_PROVIDER_SNAPSHOT_CREATED_AT_UTC" \
              bash /root/validate-production-vm.sh --post-reboot | tee "$EVIDENCE/post-reboot-validator.txt"
            cat /proc/sys/kernel/random/boot_id > "$EVIDENCE/post-reboot-boot-id.txt"
            systemctl --failed --no-legend --plain > "$EVIDENCE/failed-units-post-reboot.txt" || true
            /opt/hostpanel/venv/bin/python /opt/hostpanel/app/hostpanel-doctor --quiet \
              > "$EVIDENCE/doctor-post-reboot.txt" 2>&1
          '

      - name: Run external network probes
        run: |
          set -euo pipefail
          {
            echo '== DNS =='
            getent ahosts "$PANEL_HOST"
            dig +short A "$PANEL_HOST" | tee /tmp/panel-a-records.txt
            grep -Fxq "$VPS_HOST" /tmp/panel-a-records.txt
            echo '== trusted HTTPS headers =='
            curl -fsSI --connect-timeout 15 --max-time 30 "https://${PANEL_HOST}/"
            echo '== required TCP listeners from runner over IPv4 =='
            for port in "$VPS_PORT" 25 53 80 443 587 993; do
              nc -z -w 8 "$VPS_HOST" "$port"
              echo "OPEN $port"
            done
            if [[ -n "$VPS_IPV6" ]]; then
              echo '== required TCP listeners from runner over IPv6 =='
              for port in "$VPS_PORT" 80 443; do
                nc -6 -z -w 8 "$VPS_IPV6" "$port"
                echo "OPEN_IPV6 $port"
              done
            fi
          } | tee "$EVIDENCE_ROOT/external-probes.txt"

      - name: Collect root-only validation evidence
        if: always()
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SSHPASS" ]] || { echo 'Missing VPS_ROOT_PASSWORD.' >&2; exit 1; }
          collection_failed=false
          cleanup_failed=false
          mkdir -p "$EVIDENCE_ROOT/remote"
          if ! sshpass -e scp -r -P "${VPS_PORT:-22}" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=20 \
            root@"$VPS_HOST":/root/hostpanel-acceptance-evidence/. "$EVIDENCE_ROOT/remote/"; then
            collection_failed=true
          fi
          if ! timeout 90s sshpass -e ssh -p "${VPS_PORT:-22}" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            root@"$VPS_HOST" \
            'rm -f /root/hostpanel-acceptance.env /root/bootstrap-install.sh /root/validate-production-vm.sh /root/secure-validation-io.py /root/hostpanel-acceptance-remote.sh'; then
            cleanup_failed=true
          fi
          {
            printf 'remote_evidence_collection=%s\n' "$collection_failed"
            printf 'remote_transient_cleanup=%s\n' "$cleanup_failed"
          } > "$EVIDENCE_ROOT/collection-status.txt"
          chmod 600 "$EVIDENCE_ROOT/collection-status.txt"
          find "$EVIDENCE_ROOT" -type f -exec chmod 600 {} +
          if [[ "$collection_failed" == true ]]; then
            echo 'Remote provider evidence collection failed.' >&2
            exit 1
          fi
          if [[ "$cleanup_failed" == true ]]; then
            echo 'Remote transient-state cleanup failed.' >&2
            exit 1
          fi

      - name: Sanitize and seal provider evidence before upload
        if: always()
        id: provider_evidence
        run: |
          set -euo pipefail
          python3 tools/prepare-provider-evidence.py
          python3 tools/sanitize-provider-evidence.py "$EVIDENCE_ROOT"
          python3 tools/seal-provider-evidence.py "$EVIDENCE_ROOT" "$SEALED_EVIDENCE"
          sha256sum "$SEALED_EVIDENCE" > "${SEALED_EVIDENCE}.sha256"
          chmod 600 "$SEALED_EVIDENCE" "${SEALED_EVIDENCE}.sha256"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Upload sealed acceptance evidence
        if: ${{ always() && steps.provider_evidence.outputs.ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hostpanel-vps-acceptance-${{ github.run_id }}-${{ inputs.reviewed_commit_sha }}
          path: |
            provider-artifacts/hostpanel-vps-acceptance.tar
            provider-artifacts/hostpanel-vps-acceptance.tar.sha256
          if-no-files-found: error
          retention-days: 14
